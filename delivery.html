<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення — TREND-sports</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="site-images.css">
    <style>
        .delivery .stars,
        .delivery .star,
        .delivery .rating-stars {
            display: none !important;
        }

        .delivery-image-wrap {
            position: relative;
            display: inline-block;
        }

        .delivery-image-wrap::after {
            content: "";
            position: absolute;
            top: 12px;
            right: 12px;
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 12px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="delivery">
    <header>
        <h1 class="tysm">Замовити товар</h1>
    </header>
    <main class="delivery-main">
        <div class="delivery-image-wrap">
            <img class="delivery-image" src="./зображення_viber_2026-11-14_17-54-08-247.png" alt="Спортивний товар з каталогу">
        </div>
        <form action="submit_order.php" method="POST">
            <label for="name">Ім'я:</label>
            <input type="text" id="name" name="name" required>

            <label for="address">Адреса доставки:</label>
            <input type="text" id="address" name="address" required>

            <label for="phone">Телефон:</label>
            <input type="tel" id="phone" name="phone" required>

            <button type="submit">Замовити</button>
        </form>
    </main>
</body>
</html>
