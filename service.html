<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оцініть наш сервіс</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="site-images.css">
</head>
<body class="b rating-page">
    <header>
        <h1 class="a">Оцініть сервіс нашої доставки!</h1>
    </header>
    <main class="a">
        <div class="stars" aria-label="Оцінка від 1 до 5">
            <span data-value="1" aria-label="1 з 5">★</span>
            <span data-value="2" aria-label="2 з 5">★</span>
            <span data-value="3" aria-label="3 з 5">★</span>
            <span data-value="4" aria-label="4 з 5">★</span>
            <span data-value="5" aria-label="5 з 5">★</span>
        </div>
    </main>
    <button id="send">Відправити</button>
    <script>
        let rating = 0;
        const stars = document.querySelectorAll(".stars span");
        stars.forEach(star => {
            star.addEventListener("click", function () {
                rating = Number(this.dataset.value);
                stars.forEach(item => item.classList.toggle("active", Number(item.dataset.value) <= rating));
            });
        });
        document.getElementById("send").addEventListener("click", function () {
            alert(rating === 0 ? "Будь ласка, оберіть оцінку!" : "Дякуємо за оцінку: " + rating + " з 5!");
        });
    </script>
</body>
</html>
